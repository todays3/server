[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    integration: FastAPI HTTP + DB tests (ASGI / TestClient)
    unit: isolated unit tests

[coverage:run]
source = app
branch = false

[coverage:report]
fail_under = 90
show_missing = true
skip_empty = true
omit =
    app/__init__.py
    app/deps/__init__.py
    app/routers/__init__.py
    app/services/__init__.py
    app/catalog/__init__.py
